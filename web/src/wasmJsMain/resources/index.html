<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Nuvelo</title>
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuvelo">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #050507; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #050507; transition: opacity .3s; z-index: 10; }
    #boot svg { width: 30vmin; max-width: 160px; animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    #probe { position: fixed; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="probe"></div>
  <div id="boot">
    <svg viewBox="12 14 72 82"><path fill="#C4C5CD" d="M22 24Q22 19 27 19H35Q40 19 40 24V27C44 21 51 18 58 18C71 18 80 27 80 41V77Q80 82 75 82H67Q62 82 62 77V44C62 38 58 35 52.5 35C46 35 40 40 40 47V81Q40 86 35 87.5L17 91.5Q13 92.3 14.5 88.8L22 72Z"/></svg>
  </div>
  <script>
    // The app's box follows the part of the screen that is really seen: the iPhone keyboard covers the page
    // without making it smaller, so the box is sized to the visible part (the writing bar stays above the keyboard).
    (function () {
      const app = document.getElementById('app');
      const probe = document.getElementById('probe');
      const vv = window.visualViewport;
      let lastH = -1, lastTop = -1;
      function fit() {
        // Android shrinks the window itself for the keyboard and the visible part can lag behind it,
        // so the smaller of the two is the part really seen; when the keyboard goes both grow back.
        const h = Math.round(vv ? Math.min(vv.height, window.innerHeight) : window.innerHeight);
        const t = Math.round(vv ? vv.offsetTop : 0);
        window.scrollTo(0, 0);
        const cs = getComputedStyle(probe);
        const top = parseFloat(cs.paddingTop) || 0;
        const bottom = parseFloat(cs.paddingBottom) || 0;
        const keyboard = (screen.height - h > screen.height * 0.3) || (window.innerHeight - h > 120);
        if (window.nuveloSafeArea) window.nuveloSafeArea(top, keyboard ? 0 : bottom);
        if (h === lastH && t === lastTop) return;
        lastH = h; lastTop = t;
        app.style.height = h + 'px';
        app.style.top = t + 'px';
      }
      // The sizes settle a little after the keyboard opens or closes: look again for a moment.
      function settle() { fit(); requestAnimationFrame(fit); [80, 200, 400, 700].forEach((d) => setTimeout(fit, d)); }
      window.nuveloSafeAreaNow = fit;
      if (vv) { vv.addEventListener('resize', settle); vv.addEventListener('scroll', fit); }
      window.addEventListener('resize', fit);
      window.addEventListener('focusout', () => setTimeout(settle, 50));
      window.addEventListener('orientationchange', () => setTimeout(settle, 300));
      document.addEventListener('visibilitychange', settle);
      fit();
    })();
    // The page's own right-click menu (the browser's would cover it).
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
  <script src="nuvelo.js"></script>
</body>
</html>
